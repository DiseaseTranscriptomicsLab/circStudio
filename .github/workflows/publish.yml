name: publish

# Runs when a GitHub release is published (Releases -> Draft a new release ->
# Publish release). Builds circStudio and uploads it to PyPI using PyPI's
# trusted publishing, so no PyPI password or token is stored on GitHub.

on:
  release:
    types: [published]

jobs:
  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Refuse to publish if the release tag (e.g. v1.1.3) does not match the
      # version in pyproject.toml (e.g. 1.1.3).
      - name: Check that the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          if [ "$tag" != "$version" ]; then
            echo "Release tag ($tag) does not match pyproject.toml version ($version)."
            exit 1
          fi

      - name: Build source distribution and wheel
        run: uv build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
